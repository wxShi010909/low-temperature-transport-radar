const growth=d.createElement('section');growth.id='growth';growth.className='tab';growth.innerHTML=`<div class="gwrap"><div class="gstack"><div class="gcard"><h2>生长曲线与生长速度</h2><div class="gformula">R = k · max(σ − σ₀, 0)<sup>n</sup></div><div class="gnote">绝对生长速度必须通过实测速率或可靠文献点标定。不同晶面、pH、杂质与流场应分别建立参数。</div><div class="grow"><div class="gf"><label>材料</label><select id="gMat"><option>KDP</option><option>DKDP</option></select></div><div class="gf"><label>晶面</label><select id="gFace"><option>{100} 棱柱面</option><option>{101} 锥面</option><option>整体 / 轴向</option></select></div></div><div class="grow"><div class="gf"><label>幂指数 n</label><input id="gN" type="number" value="1.5" step="0.05"></div><div class="gf"><label>死区 σ₀ / %</label><input id="gS0" type="number" value="0" step="0.1"></div></div><h3 style="margin-top:18px">单点标定</h3><div class="grow"><div class="gf"><label>参考 σref / %</label><input id="gRefS" type="number" value="4" step="0.1"></div><div class="gf"><label>参考 Rref / μm·h⁻¹</label><input id="gRefR" type="number" placeholder="填入实测值" step="0.01"></div></div><div class="gf"><label>预测过饱和度 σ / %</label><input id="gTar" type="number" value="3" step="0.1"></div><button id="gCalc" class="btn primary" style="margin-top:12px;width:100%">计算生长速度</button></div><div class="gcard"><h3>实验数据拟合 k 与 n</h3><p class="mut">每个晶面单独输入两列数据。</p><textarea id="gData" class="gdata">过饱和度(%),生长速度(μm/h)\n2,\n4,\n6,\n8,</textarea><div class="gact"><button id="gFit" class="primary">拟合实验数据</button><button id="gClear">清空拟合</button></div><div id="gFitNote" class="gnote">有 ≥3 个有效点后可自动拟合。</div></div></div><div class="gstack"><div class="gcard"><div id="gMetrics" class="gm"></div><div id="gCurve" class="gp"></div></div><div class="gcard"><h3>生长过程：R(t) 与尺寸 L(t)</h3><div class="grow"><div class="gf"><label>初始尺寸 L₀ / mm</label><input id="gL0" type="number" value="10"></div><div class="gf"><label>生长时长 / day</label><input id="gDur" type="number" value="7"></div></div><div class="grow"><div class="gf"><label> const home=d.getElementById('home');if(home){home.innerHTML=`<div class="home"><section class="banner"><div class="copy"><div class="eyebrow">CRYSTAL GROWTH MODEL</div><h1 class="title">KDP / DKDP<br>溶解度模型</h1><p class="sub">用于晶体生长实验中的溶解度、过饱和度、生长速度、降温设计与实验数据校正。</p><div class="meta"><span>公开文献基准</span><span>实验数据校正</span><span>生长动力学</span><span>DKDP 二维响应面</span></div></div><div class="photoBox"><img class="photo" src="${PHOTO}" alt="DKDP 晶体实物参考"></div></section><section class="features">${fc('kdp','◔','KDP 溶解度与配液','查询溶解度、反算饱和温度并计算配液质量。')}${fc('cool','♨','过饱和度与降温','计算过饱和度、析晶量并分析降温过程。')}${fc('growth','↗','生长曲线与生长速度','建立 R–σ 曲线，预测速度和尺寸随时间变化。')}${fc('fit','⌁','实验数据拟合','用实测饱和点比较模型并校正参数。')}${fc('dkdp','◇','DKDP 温度–氘化率模型','建立 S=f(T,D) 二维响应面与预测模型。')}</section><section class="lower"><div class="panel"><div class="ph">快速计算</div><div class="quick"><div class="q"><label>水的质量</label><div class="qr"><input id="qw" type="number" value="1"><select id="qu"><option value="kg">kg</option><option value="g">g</option></select></div></div><div class="q"><label>目标溶解度 S（可选）</label><input id="qs" type="number" value="37.5"></div><div class="q"><label>温度 T / ℃</label><input id="qt" type="number" value="45"></div><button id="qc" class="go">开始计算</button><div id="qres" class="res"><div class="r"><small>预测溶解度</small><b id="o1">—</b></div><div class="r"><small>所需 KDP 质量</small><b id="o2">—</b></div><div class="r"><small>反算饱和温度</small><b id="o3">—</b></div></div></div></div><div class="panel morph"><div><div class="ph">DKDP 晶体形貌参考</div><p>首页采用实物晶体图作为形貌参考；模型计算与展示图片相互独立。</p><button data-go="dkdp">进入 DKDP 模型 →</button></div><img src="${PHOTO}" alt="DKDP 晶体实物参考"></div></section><div class="privacy">计算在当前浏览器页面完成；实验数据不会自动写回 GitHub。</div></div>`;home.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>jump(b.dataset.go));const S=t=>.00602*t*t+.208*t+15.9,inv=x=>{const a=.00602,b=.208,c=15.9-x,z=b*b-4*a*c;if(z<0)return NaN;return(-b+Math.sqrt(z))/(2*a)};home.querySelector('#qc').onclick=()=>{const t=+home.querySelector('#qt').value,wv=+home.querySelector('#qw').value,u=home.querySelector('#qu').value,wg=wv*(u==='kg'?1000:1),ss=S(t),m=wg*ss/100,iv=inv(+home.querySelector('#qs').value);home.querySelector('#o1').textContent=ss.toFixed(3)+' g/100 g H₂O';home.querySelector('#o2').textContent=m.toFixed(2)+' g';home.querySelector('#o3').textContent=Number.isFinite(iv)?iv.toFixed(3)+' ℃':'—';home.querySelector('#qres').classList.add('show')}}

let fitM=null;const gv=id=>+growth.querySelector('#'+id).value,fmt=(x,n=3)=>Number.isFinite(x)?x.toFixed(n):'—';function pars(){if(fitM)return fitM;const n=Math.max(.01,gv('gN')),s0=Math.max(0,gv('gS0'))/100,rs=gv('gRefS')/100,rr=gv('gRefR'),drv=Math.max(rs-s0,0),k=rr>0&&drv>0?rr/Math.pow(drv,n):NaN;return{k,n,s0,src:Number.isFinite(k)?'单点标定':'未标定'}}function rate(sp,p=pars()){return Number.isFinite(p.k)?p.k*Math.pow(Math.max(sp/100-p.s0,0),p.n):NaN}function mi(k,v,s=''){return`<div class="gmi"><small>${k}</small><b>${v}</b><small>${s}</small></div>`}function renderG(){const p=pars(),tar=gv('gTar'),r=rate(tar,p),mat=growth.querySelector('#gMat').value,face=growth.querySelector('#gFace').value;growth.querySelector('#gMetrics').innerHTML=mi('参数来源',p.src,mat+' · '+face)+mi('k',Number.isFinite(p.k)?fmt(p.k):'待标定','R: μm/h')+mi('n',fmt(p.n),'幂律指数')+mi('当前速度',Number.isFinite(r)?fmt(r)+' μm/h':'待标定','σ='+fmt(tar,1)+'%');const xs=[],ys=[],xmax=Math.max(12,tar*1.5,gv('gRefS')*1.5);for(let i=0;i<=160;i++){const x=xmax*i/160;xs.push(x);ys.push(rate(x,p))}if(Number.isFinite(p.k))w.Plotly.react(growth.querySelector('#gCurve'),[{x:xs,y:ys,mode:'lines',name:'R(σ)'},{x:[tar],y:[r],mode:'markers',marker:{size:10},name:'当前点'}],{height:430,margin:{l:65,r:20,t:20,b:55},xaxis:{title:'过饱和度 σ / %'},yaxis:{title:'生长速度 R / (μm·h⁻¹)'},paper_bgcolor:'#fff',plot_bgcolor:'#fff',font:{family:'Microsoft YaHei'}});else{const sr=Math.max(gv('gRefS'),.1),yy=xs.map(x=>Math.pow(x/sr,p.n));w.Plotly.react(growth.querySelector('#gCurve'),[{x:xs,y:yy,mode:'lines',name:'归一化 R/Rref'}],{height:430,margin:{l:65,r:20,t:20,b:55},xaxis:{title:'过饱和度 σ / %'},yaxis:{title:'归一化生长速度 R/Rref'},paper_bgcolor:'#fff',plot_bgcolor:'#fff',font:{family:'Microsoft YaHei'}})}}renderG();growth.querySelector('#gCalc').onclick=()=>{fitM=null;renderG()};growth.querySelector('#gFit').onclick=()=>{const lines=growth.querySelector('#gData').value.trim().split(/\r?\n/).slice(1),pts=[];lines.forEach(l=>{const c=l.split(/[,，\t]/).map(x=>+x.trim());if(c[0]>0&&c[1]>0)pts.push(c)});if(pts.length<3){growth.querySelector('#gFitNote').textContent='至少需要 3 个有效数据点。';return}const s0=Math.max(0,gv('gS0'))/100,v=pts.filter(x=>x[0]/100>s0),X=v.map(x=>Math.log(x[0]/100-s0)),Y=v.map(x=>Math.log(x[1])),xm=X.reduce((a,b)=>a+b)/X.length,ym=Y.reduce((a,b)=>a+b)/Y.length,n=X.reduce((a,x,i)=>a+(x-xm)*(Y[i]-ym),0)/X.reduce((a,x)=>a+(x-xm)**2,0),lnk=ym-n*xm,k=Math.exp(lnk),pred=X.map(x=>lnk+n*x),sse=Y.reduce((a,y,i)=>a+(y-pred[i])**2,0),sst=Y.reduce((a,y)=>a+(y-ym)**2,0),r2=1-sse/sst;fitM={k,n,s0,src:'实验数据拟合'};growth.querySelector('#gN').value=n.toFixed(4);growth.querySelector('#gFitNote').textContent=`拟合完成：k=${fmt(k,4)}，n=${fmt(n,4)}，log-space R²=${fmt(r2,4)}`;renderG()};growth.querySelector('#gClear').onclick=()=>{fitM=null;growth.querySelector('#gFitNote').textContent='已清除拟合参数。';renderG()};growth.querySelector('#gTime').onclick=()=>{const p=pars();if(!Number.isFinite(p.k)){growth.querySelector('#gTimeNote').textContent='请先用实测速度进行单点标定，或拟合实验数据。';return}const L0=gv('gL0'),dur=Math.max(.1,gv('gDur')),s1=gv('gStart'),s2=gv('gEnd'),tt=[],rr=[],LL=[];let L=L0,prev=rate(s1,p)*24/1000,steps=200,dt=dur/steps;for(let i=0;i<=steps;i++){const t=dur*i/steps,sp=s1+(s2-s1)*i/steps,rh=rate(sp,p),rd=rh*24/1000;if(i)L+=(prev+rd)*.5*dt;tt.push(t);rr.push(rh);LL.push(L);prev=rd}w.Plotly.react(growth.querySelector('#gTimePlot'),[{x:tt,y:LL,mode:'lines',name:'尺寸 L / mm'},{x:tt,y:rr,mode:'lines',name:'速度 R / μm·h⁻¹',yaxis:'y2'}],{height:430,margin:{l:65,r:65,t:20,b:55},xaxis:{title:'时间 / day'},yaxis:{title:'尺寸 L / mm'},yaxis2:{title:'R / μm·h⁻¹',overlaying:'y',side:'right'},paper_bgcolor:'#fff',plot_bgcolor:'#fff',font:{family:'Microsoft YaHei'},legend:{orientation:'h'}});growth.querySelector('#gTimeNote').innerHTML=`${fmt(dur,1)} day 后，有效线性尺寸由 <b>${fmt(L0)} mm</b> 增至约 <b>${fmt(L)} mm</b>。此结果未包含溶质耗尽、传质与晶面面积变化。`};
function relabel(id,text,note){const el=d.getElementById(id);if(!el)return;const lab=el.previousElementSibling;if(lab&&lab.tagName==='LABEL')lab.textContent=text;if(note){const p=d.createElement('div');p.className='field-note';p.textContent=note;el.insertAdjacentElement('afterend',p)}}relabel('T','温度 T','单位：℃');relabel('Sinv','目标溶解度 S（用于反算饱和温度）','单位：g KDP / 100 g H₂O');relabel('Ts','初始饱和温度 Ts','单位：℃');relabel('Tn','当前 / 终止温度 T','单位：℃');relabel('st','目标过饱和度 σ','单位：%');relabel('days','线性降温时长','单位：day');relabel('dpt','预测温度','单位：℃');relabel('dpd','预测氘化率','单位：%');
function mass(id){const o=d.getElementById(id);if(!o)return;const grams=+o.value||0;o.style.display='none';const b=d.createElement('div');b.className='mass-ui';const v=d.createElement('input'),u=d.createElement('select');v.type='number';u.innerHTML='<option value="kg">kg</option><option value="g">g</option>';u.value=grams>=1000?'kg':'g';v.value=u.value==='kg'?grams/1000:grams;b.append(v,u);o.insertAdjacentElement('afterend',b);const sync=()=>{o.value=(+v.value||0)*(u.value==='kg'?1000:1);o.dispatchEvent(new Event('input',{bubbles:true}))};v.oninput=sync;u.onchange=()=>{const g=+o.value||0;v.value=u.value==='kg'?g/1000:g;sync()}}mass('W');mass('Wc');
const dp=d.getElementById('dkdp');if(dp){const p=dp.querySelector('.mut');if(p)p.textContent='三列：温度（℃）、氘化率（%）、溶解度（g / 100 g 溶剂）。'}const footer=d.querySelector('.foot');if(footer)footer.remove();setTimeout(()=>w.dispatchEvent(new Event('resize')),160)}catch(e){console.error(e)}})
</script></body></html>
