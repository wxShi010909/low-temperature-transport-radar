const map=[['home','首页'],['kdp','KDP 基准'],['cool','过饱和度与降温'],['fit','实验数据拟合'],['dkdp','DKDP 二维模型'],['refs','方法与文献']];const top=d.createElement('header');top.className='top';top.innerHTML=`<div class="brand"><svg viewBox="0 0 32 32" fill="none"><path d="M16 3 27 9.3v12.8L16 28.4 5 22.1V9.3L16 3Z" stroke="currentColor" stroke-width="1.5"/><path d="M16 3v25.4M5 9.3l22 12.8M27 9.3 5 22.1" stroke="currentColor" stroke-width="1.1"/></svg><span>KDP / DKDP 溶解度模型</span></div><nav class="nav">${map.map((x,i)=>`<button data-go="${x[0]}" class="${i?'':'on'}">${x[1]}</button>`).join('')}</nav>`;d.body.prepend(top);
function jump(k){const t=[...d.querySelectorAll('.tabs button')].find(x=>x.dataset.t===k);if(t)t.click();top.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.go===k));setTimeout(()=>w.scrollTo(0,0),20)}top.querySelectorAll('button').forEach(b=>b.onclick=()=>jump(b.dataset.go));
const home=d.getElementById('home');if(home){home.innerHTML=`<div class="home"><section class="banner"><div class="copy"><div class="eyebrow">CRYSTAL GROWTH MODEL</div><h1 class="title">KDP / DKDP<br>溶解度模型</h1><p class="sub">用于晶体生长实验中的溶解度、过饱和度、降温设计与实验数据校正。</p><div class="meta"><span>公开文献基准</span><span>实验数据校正</span><span>多模型比较</span><span>DKDP 二维响应面</span></div></div><div class="photoBox"><img class="photo" src="${PHOTO}" alt="DKDP 晶体实物参考"></div></section><section class="features"><button class="feat" data-go="kdp"><div class="ico">◔</div><h3>KDP 溶解度与配液</h3><p>查询溶解度、反算饱和温度，并计算配液所需 KDP 质量。</p><span class="arr">→</span></button><button class="feat" data-go="cool"><div class="ico">♨</div><h3>过饱和度与降温</h3><p>计算过饱和度、理论析晶量，并分析降温过程。</p><span class="arr">→</span></button><button class="feat" data-go="fit"><div class="ico">⌁</div><h3>实验数据拟合</h3><p>用实测饱和点比较模型、校正参数并评估拟合误差。</p><span class="arr">→</span></button><button class="feat" data-go="dkdp"><div class="ico">◇</div><h3>DKDP 温度–氘化率模型</h3><p>建立 S=f(T,D) 二维响应面，查看预测结果与响应关系。</p><span class="arr">→</span></button></section><section class="lower"><div class="panel"><div class="ph">快速计算</div><div class="quick"><div class="q"><label>水的质量</label><div class="qr"><input id="qw" type="number" value="1" min="0" step="0.1"><select id="qu"><option value="kg">kg</option><option value="g">g</option></select></div></div><div class="q"><label>目标溶解度 S（可选）</label><input id="qs" type="number" value="37.5" step="0.01"></div><div class="q"><label>温度 T / ℃</label><input id="qt" type="number" value="45" step="0.1"></div><button id="qc" class="go">开始计算</button><div id="qres" class="res"><div class="r"><small>预测溶解度</small><b id="o1">—</b></div><div class="r"><small>所需 KDP 质量</small><b id="o2">—</b></div><div class="r"><small>反算饱和温度</small><b id="o3">—</b></div></div></div></div><div class="panel morph"><div><div class="ph">DKDP 晶体形貌参考</div><p>首页直接采用实物晶体图作为形貌参考，不再使用抽象多面体替代。模型计算本身与展示图片相互独立。</p><button data-go="dkdp">进入 DKDP 模型 →</button></div><img src="${PHOTO}" alt="DKDP 晶体实物参考"></div></section><div class="privacy">计算在当前浏览器页面完成；实验数据不会自动写回 GitHub。</div></div>`;home.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>jump(b.dataset.go));const S=t=>.00602*t*t+.208*t+15.9,inv=x=>{const a=.00602,b=.208,c=15.9-x,z=b*b-4*a*c;if(z<0)return NaN;return(-b+Math.sqrt(z))/(2*a)};home.querySelector('#qc').onclick=()=>{const t=+home.querySelector('#qt').value,wv=+home.querySelector('#qw').value||0,u=home.querySelector('#qu').value,sg=+home.querySelector('#qs').value,sol=S(t),g=wv*(u==='kg'?1000:1),iv=inv(sg);home.querySelector('#o1').textContent=sol.toFixed(3)+' g / 100 g H₂O';home.querySelector('#o2').textContent=(g*sol/100).toFixed(2)+' g';home.querySelector('#o3').textContent=Number.isFinite(iv)?iv.toFixed(3)+' ℃':'—';home.querySelector('#qres').classList.add('show')}}
function rel(id,txt,note){const e=d.getElementById(id);if(!e)return;const l=e.previousElementSibling;if(l&&l.tagName==='LABEL')l.textContent=txt;if(note){const p=d.createElement('div');p.className='field-note';p.textContent=note;e.insertAdjacentElement('afterend',p)}}rel('T','温度 T','单位：℃');rel('Sinv','目标溶解度 S（用于反算饱和温度）','单位：g KDP / 100 g H₂O');rel('Ts','初始饱和温度 Ts','单位：℃');rel('Tn','当前 / 终止温度 T','单位：℃');rel('st','目标过饱和度 σ','单位：%');rel('days','线性降温时长','单位：day');
function mass(id){const o=d.getElementById(id);if(!o||o.dataset.x)return;o.dataset.x=1;const l=o.previousElementSibling;if(l&&l.tagName==='LABEL')l.textContent='水的质量';const g=+o.value||0;o.style.display='none';const b=d.createElement('div');b.className='mass-ui';const v=d.createElement('input'),u=d.createElement('select');v.type='number';v.min=0;v.step=.1;u.innerHTML='<option value="kg">kg</option><option value="g">g</option>';u.value=g>=1000?'kg':'g';v.value=u.value==='kg'?g/1000:g;b.append(v,u);o.insertAdjacentElement('afterend',b);const sync=()=>{o.value=(+v.value||0)*(u.value==='kg'?1000:1);o.dispatchEvent(new Event('input',{bubbles:true}))};v.oninput=sync;u.onchange=()=>{const x=+o.value||0;v.value=u.value==='kg'?x/1000:x;sync()}}mass('W');mass('Wc');const foot=d.querySelector('.foot');if(foot)foot.remove();setTimeout(()=>w.dispatchEvent(new Event('resize')),150)}catch(e){console.error(e)}});
