<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP / DKDP 溶解度与晶体生长模型</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}iframe{display:block;border:0;width:100%;height:100%}</style></head><body><iframe id="app" src="../kdp-solubility-model/" title="KDP / DKDP 溶解度与晶体生长模型"></iframe><script>
const f=document.getElementById('app');
f.addEventListener('load',()=>{try{const d=f.contentDocument,w=f.contentWindow;const st=d.createElement('style');st.textContent=`

`;d.head.appendChild(st);
const hero=d.querySelector('.hero h1');if(hero)hero.textContent='KDP / DKDP 溶解度与晶体生长模型';const hp=d.querySelector('.hero p');if(hp)hp.textContent='从文献基准到实验校正：配液、饱和点、过饱和度、降温设计与 DKDP 温度–氘化率响应面';
const home=d.getElementById('home');if(home){const left=home.querySelector('.c8'),right=home.querySelector('.c4');if(left){const h=left.querySelector('h2');if(h)h.textContent='你现在想做什么？';left.querySelectorAll('.pill').forEach(x=>x.remove());const old=left.querySelector('.note');if(old)old.remove();const q=d.createElement('div');q.className='quick-ui';q.innerHTML='<button data-go="kdp"><b>查溶解度 / 配饱和溶液</b><small>输入温度和水量，得到饱和溶解度、所需 KDP 质量，并可反算饱和温度。</small></button><button data-go="cool"><b>算过饱和度 / 设计降温</b><small>输入初始饱和温度和目标温度，计算过饱和度、析晶量和降温过程。</small></button><button data-go="fit"><b>用自己的实验数据校正</b><small>导入实测饱和点，自动比较模型，并给出拟合误差与外推提醒。</small></button><button data-go="dkdp"><b>建立 DKDP 二维模型</b><small>同时考虑温度和氘化率，建立 S(T,D) 响应面并辅助选择下一实验点。</small></button>';left.appendChild(q);q.querySelectorAll('button').forEach(b=>b.onclick=()=>{const target=[...d.querySelectorAll('.tabs button')].find(x=>x.dataset.t===b.dataset.go);if(target)target.click()});}
if(right){const h=right.querySelector('h2');if(h)h.textContent='模型说明';const p=right.querySelector('.mut');if(p)p.textContent='KDP 使用公开文献经验式作为基准；DKDP 按不同氘化率用真实实验数据校正。';const warn=right.querySelector('.warn');if(warn){warn.className='clean-note';warn.textContent='实验数据只在当前页面中参与计算，刷新后默认消失。';}}
}
[...d.querySelectorAll('label')].forEach(l=>{const t=l.textContent.trim();if(t==='水质量 / g'){l.textContent='水的质量';const n=d.createElement('div');n.className='field-note';n.textContent='单位：g（例如 1 kg 水请输入 1000）';l.insertAdjacentElement('afterend',n)}if(t.startsWith('反算目标溶解度')){l.textContent='目标溶解度 S（用于反算饱和温度）';const n=d.createElement('div');n.className='field-note';n.textContent='单位：g KDP / 100 g H₂O';l.insertAdjacentElement('afterend',n)}if(t==='目标 σ / %')l.textContent='目标过饱和度 σ（%）';if(t==='线性降温时长 / day')l.textContent='计划降温时长（天）';});
